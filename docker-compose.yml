# Local stack: Postgres + API + worker + web.
# This VM may not have Docker. The app also runs on SQLite without Compose.
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: hunter
      POSTGRES_DB: information_hunters
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter -d information_hunters"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://hunter:hunter@postgres:5432/information_hunters
      INTERNAL_API_TOKEN: dev-internal-token
      DEMO_MODE: "true"
      SECRETS_MASTER_KEY: dev-master-key-change-me
      DEMO_STEP_DELAY_MS: "200"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "information_hunters.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://hunter:hunter@postgres:5432/information_hunters
      INTERNAL_API_TOKEN: dev-internal-token
      DEMO_MODE: "true"
      SECRETS_MASTER_KEY: dev-master-key-change-me
      DEMO_STEP_DELAY_MS: "200"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_TOKEN: dev-internal-token
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
