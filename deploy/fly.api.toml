# Optional cloud API — use when the desk should talk to Postgres without a local uvicorn.
# Deploy: fly apps create ih-api && fly deploy -c deploy/fly.api.toml
# Then set web/.env.development API_INTERNAL_URL=https://ih-api.fly.dev

app = 'ih-api'
primary_region = 'lhr'

[build]
  dockerfile = 'docker/api.Dockerfile'

[env]
  DEMO_MODE = 'false'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
