[project]
name = "information-hunters"
version = "0.1.0"
description = "Control plane and workers for UK local-service lead generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "cryptography>=43",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["information_hunters*"]

[tool.setuptools.package-data]
information_hunters = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
